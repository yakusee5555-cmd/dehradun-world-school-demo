<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Application — Dehradun World School, Dehradun | Demo</title>
<meta name="description" content="Apply online to Dehradun World School, Dehradun — the full admission application form: student details and correspondence address. Demo rebuild concept.">
<meta property="og:title" content="Online Application — Dehradun World School, Dehradun | Demo">
<meta property="og:description" content="Apply online to Dehradun World School, Dehradun — the full admission application form: student details and correspondence address. Demo rebuild concept.">
<meta property="og:image" content="images/real/main-building-flagpole.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="application">

<div class="topbar">
  <span class="topbar-text" id="topbarText"></span>
  <span class="topbar-links">
    <a id="topbarPhone" href="#"></a>
    <a class="topbar-cta" href="admissions.html" id="topbarCta"></a>
  </span>
</div>

<header class="site-header">
  <a class="brand" href="index.html">
    <img class="brand-logo" src="images/logo.png" alt="Dehradun World School crest">
    <span class="brand-text">
      <strong>Dehradun World School</strong>
      <small>CISCE · ICSE &amp; ISC · Dehradun</small>
    </span>
  </a>
  <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainNav">Menu</button>
  <nav class="main-nav" id="mainNav" aria-label="Main"></nav>
</header>

<main>

  <div id="pageHero"></div>

  <section class="section">
    <div class="container">
      <form class="enquiry-form apply-form" id="applyForm">
        <p class="form-note" id="applyNote"></p>

        <h3 class="form-band">Student Details</h3>
        <div class="apply-grid">
          <label>Academic Year <span class="req">*</span>
            <select name="year" required>
              <option value="">--Select Academic Year--</option>
              <option>2026–27</option>
              <option>2027–28</option>
            </select>
          </label>
          <label>Admission sought in class <span class="req">*</span>
            <select name="class" required>
              <option value="">--Select Class--</option>
              <option>Pre-Primary</option>
              <option>Class 1</option><option>Class 2</option><option>Class 3</option>
              <option>Class 4</option><option>Class 5</option><option>Class 6</option>
              <option>Class 7</option><option>Class 8</option><option>Class 9</option>
              <option>Class 10</option><option>Class 11</option><option>Class 12</option>
            </select>
          </label>
          <label>Student First Name <span class="req">*</span>
            <input type="text" name="firstName" required>
          </label>
          <label>Student Middle Name
            <input type="text" name="middleName">
          </label>
          <label>Student Last Name
            <input type="text" name="lastName">
          </label>
          <label>Date of Birth <span class="req">*</span>
            <input type="date" name="dob" required>
          </label>
          <label>Email <span class="req">*</span>
            <input type="email" name="email" required>
          </label>
          <label>Aadhaar No. <span class="req">*</span>
            <input type="text" name="aadhaar" inputmode="numeric" autocomplete="off" required>
          </label>
          <label>Primary Contact No. (WhatsApp No.) <span class="req">*</span>
            <input type="tel" name="phone" required>
          </label>
          <label>Father's Salutation
            <select name="fatherSalutation">
              <option value="">Select Salutation</option>
              <option>Mr.</option><option>Dr.</option><option>Prof.</option><option>Other</option>
            </select>
          </label>
          <label>Father's Name
            <input type="text" name="fatherName">
          </label>
          <label>Mother's Salutation
            <select name="motherSalutation">
              <option value="">Select Salutation</option>
              <option>Mrs.</option><option>Ms.</option><option>Dr.</option><option>Prof.</option><option>Other</option>
            </select>
          </label>
          <label>Mother's Name
            <input type="text" name="motherName">
          </label>
        </div>

        <h3 class="form-band">Correspondence Address</h3>
        <div class="apply-grid">
          <label>Address <span class="req">*</span>
            <textarea name="address" rows="3" required></textarea>
          </label>
          <label>City <span class="req">*</span>
            <input type="text" name="city" required>
          </label>
          <label>State <span class="req">*</span>
            <input type="text" name="state" required>
          </label>
          <label>Pin Code <span class="req">*</span>
            <input type="text" name="pin" inputmode="numeric" required>
          </label>
          <label>Country <span class="req">*</span>
            <input type="text" name="country" required>
          </label>
        </div>

        <button type="submit" class="btn btn-green btn-block" id="applyButton" style="margin-top:1.2rem"></button>
        <p class="form-success" id="applySuccess" hidden></p>
      </form>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div class="footer-brand">
      <img class="footer-logo" src="images/logo.png" alt="Dehradun World School crest">
      <div>
        <strong id="footerName"></strong>
        <p id="footerAff"></p>
        <p id="footerAddress"></p>
      </div>
    </div>
    <div>
      <p><a id="footerPhone" href="#"></a></p>
      <p><a id="footerEmail" href="#"></a></p>
      <p><a id="footerFb" href="#" target="_blank" rel="noopener"></a></p>
    </div>
    <nav class="footer-nav" id="footerNav" aria-label="Footer"></nav>
  </div>
  <div class="container footer-demo">
    <p id="footerDemo"></p>
    <p id="footerCredit"></p>
  </div>
</footer>

<div class="mobile-bar">
  <a class="mobile-call" id="mobileCall" href="#">Call Now</a>
  <a class="mobile-enquire" id="mobileEnquire" href="admissions.html">Enquire</a>
</div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
