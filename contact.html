<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Dehradun World School, Dehradun | Demo</title>
<meta name="description" content="Contact Dehradun World School: Bagicha, Nathuawala, Raipur-Balawala Road, Dehradun 248008. Phone +91 75790 63656. Demo rebuild concept.">
<meta property="og:title" content="Contact — Dehradun World School, Dehradun | Demo">
<meta property="og:description" content="Contact Dehradun World School: Bagicha, Nathuawala, Raipur-Balawala Road, Dehradun 248008. Phone +91 75790 63656. Demo rebuild concept.">
<meta property="og:image" content="images/real/main-building-flagpole.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">

<div class="topbar">
  <span class="topbar-text" id="topbarText"></span>
  <span class="topbar-links">
    <a id="topbarPhone" href="#"></a>
    <a class="topbar-cta" href="admissions.html" id="topbarCta"></a>
  </span>
</div>

<header class="site-header">
  <a class="brand" href="index.html">
    <img class="brand-logo" src="images/logo.png" alt="Dehradun World School crest">
    <span class="brand-text">
      <strong>Dehradun World School</strong>
      <small>CISCE · ICSE &amp; ISC · Dehradun</small>
    </span>
  </a>
  <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainNav">Menu</button>
  <nav class="main-nav" id="mainNav" aria-label="Main"></nav>
</header>

<main>

  <div id="pageHero"></div>

  <section class="section">
    <div class="container contact-grid">
      <div>
        <h2 id="contactHeading"></h2>
        <address class="contact-address" id="contactAddress"></address>
        <p class="contact-line"><span class="contact-label">Phone</span><a id="contactPhone" href="#"></a></p>
        <p class="contact-line"><span class="contact-label">Email</span><a id="contactEmail" href="#"></a></p>
        <p class="contact-line"><span class="contact-label">Office hours</span><span><span id="officeHours"></span><br><small id="officeHoursNote"></small></span></p>
        <p class="contact-line"><span class="contact-label">Facebook</span><a id="contactFb" href="#" target="_blank" rel="noopener"></a></p>
        <div class="contact-ctas">
          <a class="btn btn-green" href="#" id="contactCall"></a>
          <a class="btn btn-ghost" href="#" id="mapLink" target="_blank" rel="noopener"></a>
        </div>
        <div class="adm-card">
          <h3 id="admCardHeading"></h3>
          <p id="admCardText"></p>
          <a class="btn btn-green" href="admissions.html" id="admCardBtn"></a>
        </div>
      </div>
      <div class="contact-card">
        <img class="contact-crest" src="images/logo.png" alt="Dehradun World School crest">
        <h3 id="contactCardName"></h3>
        <p id="contactCardAff"></p>
        <p id="contactCardMotto"></p>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div class="footer-brand">
      <img class="footer-logo" src="images/logo.png" alt="Dehradun World School crest">
      <div>
        <strong id="footerName"></strong>
        <p id="footerAff"></p>
        <p id="footerAddress"></p>
      </div>
    </div>
    <div>
      <p><a id="footerPhone" href="#"></a></p>
      <p><a id="footerEmail" href="#"></a></p>
      <p><a id="footerFb" href="#" target="_blank" rel="noopener"></a></p>
    </div>
    <nav class="footer-nav" id="footerNav" aria-label="Footer"></nav>
  </div>
</footer>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
