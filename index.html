<body data-page="home">

<div class="topbar">
  <span class="topbar-text" id="topbarText"></span>
  <span class="topbar-links">
    <a id="topbarPhone" href="#"></a>
    <a class="topbar-cta" href="admissions.html" id="topbarCta"></a>
  </span>
</div>

<header class="site-header">
  <a class="brand" href="index.html">
    <img class="brand-logo" src="images/logo.png" alt="Dehradun World School crest">
    <span class="brand-text">
      <strong>Dehradun World School</strong>
      <small>CISCE · ICSE &amp; ISC · Dehradun</small>
    </span>

  <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainNav">Menu</button>

<main>

  <section class="hero">
    <div class="hero-media"><img id="heroImage" src="" alt=""></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="eyebrow eyebrow-light" id="heroEyebrow"></p>
      <h1 id="heroTitle"></h1>
      <p class="hero-tagline" id="heroTagline"></p>
      <p class="hero-motto" id="heroMotto"></p>
      <p class="hero-sub" id="heroSub"></p>
      <div class="hero-ctas">
        <a class="btn btn-green" href="admissions.html" id="heroPrimary"></a>
        <a class="btn btn-outline" href="#" id="heroSecondary"></a>
      </div>
    </div>
    <div class="stat-band" id="statBand"></div>
  </section>

  <section class="section">
    <div class="container about-grid">
      <div class="about-media"><img id="welcomeImage" src="" alt="" loading="lazy"></div>
      <div>
        <div id="welcomeHead"></div>
        <div class="prose"><p id="welcomeText"></p></div>
        <p class="center-link"><a class="text-link" href="about.html" id="welcomeLink"></a></p>
      </div>
    </div>
  </section>

  <section class="section section-tint">
    <div class="container">
      <div id="pillarsHead"></div>
      <div class="card-row" id="pillarCards"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="stagesHead"></div>
      <div class="card-row" id="stageCards"></div>
      <p class="center-link"><a class="btn btn-ghost" href="academics.html" id="stagesLink"></a></p>

  <section class="section section-green">
    <div class="container">
      <div id="facHead"></div>
      <div class="facility-grid" id="facPicks"></div>
      <p class="center-link"><a class="btn btn-outline" href="campus.html" id="facLink"></a></p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="eventsHead"></div>
      <div class="card-row flex-3" id="homeEvents"></div>
      <p class="center-link"><a class="text-link" href="school-life.html" id="eventsLink"></a></p>
    </div>
  </section>

  <section class="section section-tint">
    <div class="container">
      <div id="testHead"></div>
      <div class="card-row flex-3" id="testCards"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <p class="eyebrow">Notice board</p>
      <h2>Latest notices</h2>
      <div class="notice-list" id="noticePreview"></div>
      <p class="center-link"><a class="text-link" href="news.html">All news &amp; notices</a></p>
      <div id="fbSlot" style="margin-top:1.6rem"></div>
