<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dehradun World School, Dehradun — ICSE & ISC (CISCE) | Demo</title>
<meta name="description" content="Dehradun World School, Nathuawala, Dehradun — a co-educational CISCE school (ICSE & ISC), Pre-Primary to Class 12, established 2008 by IIT Delhi alumni. Demo rebuild concept.">
<meta property="og:title" content="Dehradun World School, Dehradun — Demo Website">
<meta property="og:description" content="A modern education and a nurturing environment where every child grows — intellectually, physically, socially and spiritually. CISCE (ICSE & ISC), Est. 2008.">
<meta property="og:image" content="images/hero.jpg">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 1. Top utility bar -->
<div class="topbar">
  <span class="topbar-text" id="topbarText"></span>
  <span class="topbar-links">
    <a id="topbarPhone" href="#"></a>
    <a class="topbar-cta" href="#admissions" id="topbarCta"></a>
  </span>
</div>

<!-- Header / nav -->
<header class="site-header">
  <a class="brand" href="#top">
    <span class="brand-mark" id="brandMark"></span>
    <span class="brand-text">
      <strong id="brandName"></strong>
      <small id="brandSub"></small>
    </span>
  </a>
  <nav class="main-nav" aria-label="Main">
    <a href="#about">About</a>
    <a href="#academics">Academics</a>
    <a href="#facilities">Campus</a>
    <a href="#admissions">Admissions</a>
    <a href="#gallery">Gallery</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main id="top">

  <!-- 2. Hero -->
  <section class="hero">
    <div class="hero-media"><img id="heroImage" src="" alt="School campus"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="eyebrow eyebrow-light" id="heroEyebrow"></p>
      <h1 id="heroTitle"></h1>
      <p class="hero-sub" id="heroSub"></p>
      <div class="hero-ctas">
        <a class="btn btn-green" href="#admissions" id="heroPrimary"></a>
        <a class="btn btn-outline" href="#" id="heroSecondary"></a>
      </div>
    </div>
    <div class="stat-band" id="statBand"></div>
  </section>

  <!-- 3. About -->
  <section class="section" id="about">
    <div class="container about-grid">
      <div class="about-media"><img id="aboutImage" src="" alt="Students learning together" loading="lazy"></div>
      <div>
        <p class="eyebrow" id="aboutEyebrow"></p>
        <h2 id="aboutHeading"></h2>
        <div id="aboutParas"></div>
        <ul class="check-list" id="aboutHighlights"></ul>
      </div>
    </div>
  </section>

  <!-- 4. Pillars -->
  <section class="section section-tint" id="pillars">
    <div class="container">
      <p class="eyebrow" id="pillarsEyebrow"></p>
      <h2 id="pillarsHeading"></h2>
      <div class="card-row" id="pillarCards"></div>
    </div>
  </section>

  <!-- 5. Academics -->
  <section class="section" id="academics">
    <div class="container">
      <p class="eyebrow" id="acadEyebrow"></p>
      <h2 id="acadHeading"></h2>
      <p class="section-intro" id="acadIntro"></p>
      <div class="card-row" id="acadCards"></div>
    </div>
  </section>

  <!-- 6. Facilities -->
  <section class="section section-green" id="facilities">
    <div class="container">
      <p class="eyebrow eyebrow-light" id="facEyebrow"></p>
      <h2 id="facHeading"></h2>
      <div class="facility-grid" id="facGrid"></div>
    </div>
  </section>

  <!-- 7. Admissions -->
  <section class="section" id="admissions">
    <div class="container">
      <p class="eyebrow" id="admEyebrow"></p>
      <h2 id="admHeading"></h2>
      <p class="section-intro" id="admIntro"></p>
      <ol class="steps" id="admSteps"></ol>
      <div class="adm-grid">
        <div class="adm-notes">
          <div class="note-card"><h3>Fees</h3><p id="feesNote"></p></div>
          <div class="note-card"><h3>Documents</h3><p id="documentsNote"></p></div>
          <div class="note-card"><h3>Key dates</h3><p id="datesNote"></p></div>
        </div>
        <form class="enquiry-form" id="enquiryForm" novalidate>
          <h3 id="formHeading"></h3>
          <p class="form-note" id="formNote"></p>
          <label>Parent name
            <input type="text" name="parent" required placeholder="Your full name">
          </label>
          <label>Phone number
            <input type="tel" name="phone" required placeholder="10-digit mobile number">
          </label>
          <label>Class applying for
            <select name="class" required>
              <option value="">Select class</option>
              <option>Pre-Primary</option>
              <option>Class 1</option><option>Class 2</option><option>Class 3</option>
              <option>Class 4</option><option>Class 5</option><option>Class 6</option>
              <option>Class 7</option><option>Class 8</option><option>Class 9</option>
              <option>Class 10</option><option>Class 11</option><option>Class 12</option>
            </select>
          </label>
          <label>Message <span class="optional">(optional)</span>
            <textarea name="message" rows="3" placeholder="Anything you'd like to ask the school office"></textarea>
          </label>
          <button type="submit" class="btn btn-green btn-block" id="formButton"></button>
          <p class="form-success" id="formSuccess" hidden></p>
        </form>
      </div>
    </div>
  </section>

  <!-- 8. Gallery -->
  <section class="section section-tint" id="gallery">
    <div class="container">
      <p class="eyebrow" id="galEyebrow"></p>
      <h2 id="galHeading"></h2>
      <p class="section-intro" id="galNote"></p>
      <div class="card-row gallery-row" id="galleryGrid"></div>
    </div>
  </section>

  <!-- 9. Parent voices -->
  <section class="section" id="voices">
    <div class="container">
      <p class="eyebrow" id="testEyebrow"></p>
      <h2 id="testHeading"></h2>
      <div class="card-row" id="testCards"></div>
    </div>
  </section>

  <!-- 10. Notice board -->
  <section class="section section-tint" id="notices">
    <div class="container">
      <p class="eyebrow" id="noticeEyebrow"></p>
      <h2 id="noticeHeading"></h2>
      <p class="section-intro" id="noticeNote"></p>
      <div class="notice-list" id="noticeList"></div>
    </div>
  </section>

  <!-- 11. Contact -->
  <section class="section" id="contact">
    <div class="container contact-grid">
      <div>
        <p class="eyebrow" id="contactEyebrow"></p>
        <h2 id="contactHeading"></h2>
        <address class="contact-address" id="contactAddress"></address>
        <p class="contact-line"><span class="contact-label">Phone</span><a id="contactPhone" href="#"></a></p>
        <p class="contact-line"><span class="contact-label">Email</span><a id="contactEmail" href="#"></a></p>
        <p class="contact-line"><span class="contact-label">Office hours</span><span><span id="officeHours"></span><br><small id="officeHoursNote"></small></span></p>
        <div class="contact-ctas">
          <a class="btn btn-green" href="#" id="contactCall"></a>
          <a class="btn btn-ghost" href="#" id="mapLink" target="_blank" rel="noopener"></a>
        </div>
      </div>
      <div class="contact-card">
        <span class="brand-mark brand-mark-lg" id="contactMark"></span>
        <h3 id="contactCardName"></h3>
        <p id="contactCardAff"></p>
      </div>
    </div>
  </section>

</main>

<!-- 12. Footer -->
<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <strong id="footerName"></strong>
      <p id="footerAff"></p>
      <p id="footerAddress"></p>
    </div>
    <div>
      <p><a id="footerPhone" href="#"></a></p>
      <p><a id="footerEmail" href="#"></a></p>
    </div>
    <nav class="footer-nav" aria-label="Footer">
      <a href="#about">About</a>
      <a href="#academics">Academics</a>
      <a href="#admissions">Admissions</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
  <div class="container footer-demo">
    <p id="footerDemo"></p>
    <p id="footerCredit"></p>
  </div>
</footer>

<!-- Sticky mobile bar -->
<div class="mobile-bar">
  <a class="mobile-call" id="mobileCall" href="#">Call Now</a>
  <a class="mobile-enquire" href="#admissions">Enquire</a>
</div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
