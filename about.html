<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Dehradun World School, Dehradun | Demo</title>
<meta name="description" content="About Dehradun World School: founded in 2008 by IIT Delhi alumni, its mission and values, the school crest and motto, and its journey to a full ICSE & ISC school. Demo rebuild concept.">
<meta property="og:title" content="About — Dehradun World School, Dehradun | Demo">
<meta property="og:description" content="About Dehradun World School: founded in 2008 by IIT Delhi alumni, its mission and values, the school crest and motto, and its journey to a full ICSE & ISC school. Demo rebuild concept.">
<meta property="og:image" content="images/real/main-building-flagpole.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="about">

<div class="topbar">
  <span class="topbar-text" id="topbarText"></span>
  <span class="topbar-links">
    <a id="topbarPhone" href="#"></a>
    <a class="topbar-cta" href="admissions.html" id="topbarCta"></a>
  </span>
</div>

<header class="site-header">
  <a class="brand" href="index.html">
    <img class="brand-logo" src="images/logo.png" alt="Dehradun World School crest">
    <span class="brand-text">
      <strong>Dehradun World School</strong>
      <small>CISCE · ICSE &amp; ISC · Dehradun</small>
    </span>
  </a>
  <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainNav">Menu</button>
  <nav class="main-nav" id="mainNav" aria-label="Main"></nav>
</header>

<main>

  <div id="pageHero"></div>

  <section class="section">
    <div class="container about-grid">
      <div class="about-media"><img id="aboutImage" src="" alt="" loading="lazy"></div>
      <div>
        <h2 id="aboutHeading"></h2>
        <div class="prose" id="aboutParas"></div>
        <ul class="check-list" id="aboutHighlights"></ul>
      </div>
    </div>
  </section>

  <section class="section section-tint">
    <div class="container">
      <div id="foundingHead"></div>
      <div class="prose" id="foundingParas" style="max-width:820px"></div>
    </div>
  </section>

  <section class="section" id="values">
    <div class="container">
      <div id="missionHead"></div>
      <div class="card-row" id="missionCards"></div>
    </div>
  </section>

  <section class="section section-tint">
    <div class="container">
      <div id="pillarsHead"></div>
      <div class="card-row" id="pillarCards"></div>
    </div>
  </section>

  <section class="section" id="crest">
    <div class="container crest-grid">
      <div class="crest-media"><img src="images/logo.png" alt="The crest of Dehradun World School"></div>
      <div>
        <p class="eyebrow" id="crestEyebrow"></p>
        <h2 id="crestHeading"></h2>
        <div class="prose"><p id="crestText"></p></div>
        <div class="crest-lines">
          <div class="crest-line"><small id="crestMottoLabel"></small><strong id="crestMotto"></strong><span id="crestMottoTr"></span></div>
          <div class="crest-line"><small id="crestTaglineLabel"></small><strong id="crestTagline"></strong></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section section-tint" id="timeline">
    <div class="container">
      <div id="timelineHead"></div>
      <ol class="timeline" id="timelineList"></ol>
    </div>
  </section>

  <section class="section" id="leadership">
    <div class="container">
      <div class="slot-card">
        <span class="slot-tag">Reserved space</span>
        <div id="leadershipHead"></div>
        <p id="leadershipNote"></p>
        <p class="center-link"><a class="btn btn-green" href="#" id="leadershipCta"></a></p>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div class="footer-brand">
      <img class="footer-logo" src="images/logo.png" alt="Dehradun World School crest">
      <div>
        <strong id="footerName"></strong>
        <p id="footerAff"></p>
        <p id="footerAddress"></p>
      </div>
    </div>
    <div>
      <p><a id="footerPhone" href="#"></a></p>
      <p><a id="footerEmail" href="#"></a></p>
      <p><a id="footerFb" href="#" target="_blank" rel="noopener"></a></p>
    </div>
    <nav class="footer-nav" id="footerNav" aria-label="Footer"></nav>
  </div>
  <div class="container footer-demo">
    <p id="footerDemo"></p>
    <p id="footerCredit"></p>
  </div>
</footer>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
